services:
  netbox:
    ports:
      - "8044:8080"
    # If you want the Nginx unit status page visible from the
    # outside of the container add the following port mapping:
    # - "8001:8081"
    env_file:
      - env/netbox.env
      - netbox.env
    healthcheck:
      # Time for which the health check can fail after the container is started.
      # This depends mostly on the performance of your database. On the first start,
      # when all tables need to be created the start_period should be higher than on
      # subsequent starts. For the first start after major version upgrades of NetBox
      # the start_period might also need to be set higher.
      # Default value in our docker-compose.yml is 60s
      start_period: 360s
    restart: unless-stopped

  netbox-worker:
    restart: unless-stopped

  netbox-housekeeping:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped

volumes:
  netbox-media-files:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/data/netbox/media-files"
  netbox-postgres-data:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/data/netbox/postgres"
  netbox-redis-cache-data:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/cache/netbox-redis"
  netbox-redis-data:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/data/netbox/redis"
  netbox-reports-files:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/data/netbox/reports-files"
  netbox-scripts-files:
    driver: "local"
    driver_opts:
      type: "none"
      o: "bind"
      device: "/docker/data/netbox/scripts-files"
